services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: chatforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chatforge
      POSTGRES_PASSWORD: chatforge
      POSTGRES_DB: chatforge
    ports:
      - '5432:5432'
    volumes:
      - chatforge-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chatforge -d chatforge']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chatforge-pgdata:
